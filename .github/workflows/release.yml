name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "Version Packages" PR branch + git tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # reserved for npm provenance (see NPM_CONFIG_PROVENANCE below)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs full history to diff against baseBranch

      - name: Setup pnpm
        # No `version:` here on purpose. action-setup@v4 reads the version from
        # the root package.json "packageManager" field, and errors out if both
        # are set rather than guessing which one wins. Bump pnpm in
        # package.json and this workflow follows automatically.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          # writes ~/.npmrc with:
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # so `changeset publish` authenticates without `npm login` / OTP.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NODE_AUTH_TOKEN is what the .npmrc written by setup-node interpolates.
          # NPM_TOKEN is what changesets/action itself looks for: without it the
          # action reports "No NPM_TOKEN found" and falls back to OIDC trusted
          # publishing, which the npm bundled with Node 22 is too old to support.
          # Both point at the same secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Uncomment to attach npm provenance (needs id-token: write, npm >= 9.5,
          # and a public repo or npm's private-repo provenance enabled):
          # NPM_CONFIG_PROVENANCE: "true"
