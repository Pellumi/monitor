name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "Version Packages" PR branch + git tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # reserved for npm provenance (see NPM_CONFIG_PROVENANCE below)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs full history to diff against baseBranch

      - name: Setup pnpm
        # No `version:` here on purpose. action-setup@v4 reads the version from
        # the root package.json "packageManager" field, and errors out if both
        # are set rather than guessing which one wins. Bump pnpm in
        # package.json and this workflow follows automatically.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI and every developer's version manager agree
          # on one number. Bump the file, not this workflow.
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
          # writes ~/.npmrc with:
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # so `changeset publish` authenticates without `npm login` / OTP.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NODE_AUTH_TOKEN is what the .npmrc written by setup-node interpolates.
          # NPM_TOKEN is what changesets/action itself looks for: without it the
          # action reports "No NPM_TOKEN found" and falls back to OIDC trusted
          # publishing, which the npm bundled with Node 22 is too old to support.
          # Both point at the same secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Uncomment to attach npm provenance (needs id-token: write, npm >= 9.5,
          # and a public repo or npm's private-repo provenance enabled):
          # NPM_CONFIG_PROVENANCE: "true"

  publish-python:
    name: Publish the Python SDK to PyPI
    needs: release
    runs-on: ubuntu-latest
    # Trusted Publishing exchanges this job's OIDC identity for a short-lived
    # PyPI token, so there is no API token to store, leak or rotate. PyPI ties
    # the trust to (repository, workflow file, environment), which is why the
    # environment name below has to match the publisher configured on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/tellann
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether this version needs publishing
        id: decide
        # The version is whatever the merged "Version Packages" PR left in
        # pyproject.toml. Asking PyPI directly, rather than reading changesets'
        # output, keeps this job idempotent: every other push to main finds the
        # version already there and stops.
        run: |
          version="$(python - <<'PY'
          import re, pathlib
          source = pathlib.Path("packages/python-sdk/pyproject.toml").read_text(encoding="utf-8")
          section = re.search(r"^\[project\][^\[]*?^version\s*=\s*\"([^\"]+)\"", source, re.M | re.S)
          print(section.group(1))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published="$(python - "$version" <<'PY'
          import json, sys, urllib.error, urllib.request
          wanted = sys.argv[1]
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/tellann/json", timeout=30) as response:
                  releases = json.load(response).get("releases", {})
          except urllib.error.HTTPError as error:
              # 404 means the project does not exist yet, so nothing is published.
              if error.code != 404:
                  raise
              releases = {}
          print("true" if wanted in releases else "false")
          PY
          )"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ "$published" = "true" ]; then
            echo "tellann $version is already on PyPI; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publishing tellann $version to PyPI." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run the Python SDK tests
        if: steps.decide.outputs.published == 'false'
        working-directory: packages/python-sdk
        run: python -m unittest discover -s tests

      - name: Build the distribution
        if: steps.decide.outputs.published == 'false'
        run: |
          python -m pip install --upgrade build
          python -m build packages/python-sdk

      - name: Publish to PyPI
        if: steps.decide.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist
